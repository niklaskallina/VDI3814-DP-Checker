name: Windows-EXE bauen

# Erzeugt eine ausfuehrbare Windows-Datei (PyInstaller) und haengt sie als
# ZIP an den Workflow-Lauf. Bei einem Tag "v*" entsteht zusaetzlich ein Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write        # fuer das Anlegen des Releases bei Tags

env:
  APP_NAME: VDI3814-DP-Checker

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.*

      - name: Tests
        run: pytest -q

      - name: Beispieldaten erzeugen
        run: python sample_data/make_samples.py

      - name: Texterkennung (Tesseract) beilegen
        shell: pwsh
        run: |
          # Scans sollen ohne Fremdinstallation lesbar sein, deshalb wird
          # Tesseract mit ausgeliefert (Apache License 2.0).
          choco install tesseract --no-progress -y
          $quelle = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path $quelle)) { throw "Tesseract wurde nicht gefunden" }
          $ziel = "tesseract"
          New-Item -ItemType Directory -Force -Path "$ziel/tessdata" | Out-Null
          Copy-Item "$quelle/tesseract.exe" $ziel -Force
          Copy-Item "$quelle/*.dll" $ziel -Force
          foreach ($sprache in @("deu", "eng", "osd")) {
            $datei = "$quelle/tessdata/$sprache.traineddata"
            if (Test-Path $datei) {
              Copy-Item $datei "$ziel/tessdata/" -Force
            } else {
              Invoke-WebRequest -UseBasicParsing `
                "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$sprache.traineddata" `
                -OutFile "$ziel/tessdata/$sprache.traineddata"
            }
          }
          Copy-Item packaging/TESSERACT-LIZENZ.txt "$ziel/" -Force
          Write-Host "Beigelegt: $((Get-ChildItem -Recurse $ziel | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      - name: EXE bauen
        run: pyinstaller vdi3814.spec --noconfirm

      - name: Beispieldaten und Kurzanleitung beilegen
        shell: pwsh
        run: |
          $target = "dist/$env:APP_NAME"
          New-Item -ItemType Directory -Force -Path "$target/sample_data" | Out-Null
          Copy-Item sample_data/*.pdf "$target/sample_data/" -Force
          Copy-Item README.md "$target/" -Force
          @"
          VDI 3814 DP-Checker
          ===================

          Starten
          -------
          $env:APP_NAME.exe             ... oeffnet die Oberflaeche im Browser
                                            (laeuft rein lokal auf 127.0.0.1)

          Kommandozeile (optional)
          ------------------------
          $env:APP_NAME.exe check
          $env:APP_NAME.exe import C:\Pfad\zu\Listen
          $env:APP_NAME.exe export Auswertung.xlsx

          Datenbank und Exporte werden neben der EXE abgelegt (Ordner data\ bzw. out\).

          Fuer gescannte Listen und Bilder wird zusaetzlich Ollama mit einem
          lokalen Vision-Modell benoetigt (siehe README.md, Abschnitt Installation).
          Excel-Dateien und PDFs mit Textebene funktionieren ohne Ollama.
          "@ | Set-Content -Encoding UTF8 "$target/START-HIER.txt"

      - name: Startfaehigkeit pruefen
        shell: pwsh
        run: |
          $exe = "dist/$env:APP_NAME/$env:APP_NAME.exe"

          # 1. Kommandozeile: sind die Spaltenprofile mitgepackt?
          # (Out-String, damit -notmatch auf einem Text und nicht auf einem
          #  Zeilen-Array arbeitet)
          $profileOut = (& $exe profile | Out-String)
          Write-Host $profileOut
          if ($LASTEXITCODE -ne 0) { throw "CLI-Aufruf 'profile' fehlgeschlagen" }
          if ($profileOut -notmatch "vdi3814_alt") { throw "Profil der alten Fassung fehlt im Build" }
          if ($profileOut -notmatch "vdi3814_neu") { throw "Profil der neuen Fassung fehlt im Build" }

          # 2. Oberflaechen-Skript einmal komplett ausfuehren. Zeigt sofort,
          #    ob Streamlit und alle verzoegerten Importe gepackt wurden.
          & $exe selbsttest
          if ($LASTEXITCODE -ne 0) { throw "Selbsttest der Oberflaeche fehlgeschlagen" }

          # 3. Vollstaendiger Ablauf: Import -> Datenbank -> Excel-Export
          & $exe import sample_data --kein-modell
          if ($LASTEXITCODE -ne 0) { throw "Import fehlgeschlagen" }
          & $exe export pruef.xlsx
          if ($LASTEXITCODE -ne 0) { throw "Export fehlgeschlagen" }
          if (-not (Test-Path pruef.xlsx)) { throw "Excel-Datei wurde nicht erzeugt" }
          Write-Host "Excel-Export erzeugt: $((Get-Item pruef.xlsx).Length) Bytes"

          # 4. Server der Oberflaeche muss tatsaechlich lauschen
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden `
                       -RedirectStandardOutput ui-out.log -RedirectStandardError ui-err.log
          $ready = $false
          foreach ($attempt in 1..20) {
            Start-Sleep -Seconds 3
            foreach ($port in 8501..8505) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) {
                  Write-Host "Oberflaeche erreichbar auf Port $port"
                  $ready = $true
                  break
                }
              } catch { }
            }
            if ($ready) { break }
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if (-not $ready) {
            Write-Host "--- Ausgabe der Anwendung ---"
            Get-Content ui-out.log, ui-err.log -ErrorAction SilentlyContinue
            throw "Oberflaeche war nicht erreichbar"
          }

      - name: Aufraeumen vor dem Packen
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "dist/$env:APP_NAME/data" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "dist/$env:APP_NAME/out" -ErrorAction SilentlyContinue
          Remove-Item -Force "dist/$env:APP_NAME/ui-out.log", "dist/$env:APP_NAME/ui-err.log" -ErrorAction SilentlyContinue

      - name: Installer bauen
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "1.0.$($env:GITHUB_RUN_NUMBER)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer konnte nicht erstellt werden" }
          Get-ChildItem Output

      - name: Installer an den Lauf anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Setup
          path: Output/VDI3814-DP-Checker-Setup.exe
          retention-days: 30

      - name: ZIP schnueren
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:APP_NAME/*" -DestinationPath "$env:APP_NAME-windows.zip" -Force
          Write-Host "Groesse: $([math]::Round((Get-Item "$env:APP_NAME-windows.zip").Length / 1MB, 1)) MB"

      - name: ZIP an den Lauf anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: ${{ env.APP_NAME }}-windows.zip
          retention-days: 30

      - name: Release veroeffentlichen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/VDI3814-DP-Checker-Setup.exe
            ${{ env.APP_NAME }}-windows.zip
          generate_release_notes: true
          body: |
            **VDI 3814 DP-Checker – Windows**

            **Empfohlen:** `VDI3814-DP-Checker-Setup.exe` herunterladen und ausfuehren.
            Das Setup installiert alles Noetige in einem Schritt – Python, Programm und
            Texterkennung sind enthalten, Administratorrechte werden nicht benoetigt.
            Danach startet das Programm ueber das Startmenue oder das Desktop-Symbol.

            Wer nichts installieren moechte, nimmt die ZIP-Datei: entpacken und
            `VDI3814-DP-Checker.exe` starten.

            Excel-Dateien, PDFs mit Textebene und gescannte Listen werden alle
            ohne zusaetzliche Software ausgewertet.
